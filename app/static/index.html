<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phishing Analyzer</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <span class="logo">Phishing Analyzer</span>
    <a href="/docs">API docs</a>
  </header>

  <main>
    <section id="upload" class="card">
      <label id="dropzone" class="dropzone" for="file">
        <input id="file" type="file" accept=".eml,message/rfc822">
        <strong>Drop a suspicious .eml file here</strong>
        <span>or click to choose one</span>
      </label>
      <label class="toggle">
        <input id="intel" type="checkbox" checked>
        <span>Threat intelligence lookups
          <small>Sends hashes, domains, URLs and IPs (never file contents) to VirusTotal, AbuseIPDB and URLhaus</small>
        </span>
      </label>
      <p id="status" role="status"></p>
    </section>

    <section id="report" hidden></section>
  </main>
</body>
</html>
