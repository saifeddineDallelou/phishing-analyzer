# CI: on every Pull Request and push to main, run the tests, then build and smoke-test the container.
# CD: after a merge to main (or a version tag like v0.1.0), publish the image to GitHub Container
#     Registry with a signed build provenance attestation.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

# Least privilege: by default every job can only read the code.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # No API keys here: tests/conftest.py blocks every real outside call anyway.
      - run: pytest -q

  docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t phishing-analyzer:ci .
      - name: Smoke test (start the container and analyze the sample)
        run: |
          docker run -d --name analyzer -p 8000:8000 --read-only --tmpfs /tmp \
            --tmpfs /home/analyzer/.cache --cap-drop ALL phishing-analyzer:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -fs -F "file=@tests/samples/phishing_example.eml" "http://localhost:8000/analyze?intel=false" \
            | python3 -c "import json, sys; r = json.load(sys.stdin); print('verdict:', r['verdict'], 'score:', r['score'], 'ml:', r['ml_probability']); assert r['verdict'] == 'malicious'"
          test "$(docker exec analyzer id -u)" = "10001" && echo "runs as non-root user"
      - name: Container logs
        if: always()
        run: docker logs analyzer || true

  publish:
    # Only after tests and smoke test pass, and never on a Pull Request:
    # code that hasn't been merged can't publish anything.
    needs: [tests, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The only job allowed to write: publish packages, and sign the build attestation.
    permissions:
      contents: read
      packages: write
      id-token: write       # lets GitHub sign the attestation for this workflow (no stored secret)
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # Registries require lowercase names: saifeddineDallelou -> saifeddinedallelou
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # temporary token created for this run only

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
